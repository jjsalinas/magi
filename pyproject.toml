[project]
name = "magi"
version = "0.0.1"
requires-python = ">=3.14"


dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.54.0",
]


[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.9"
