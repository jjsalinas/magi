[project]
name="magi"
version="0.0.1"
requires-python = "==3.14.*"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.9",
    "uvicorn[standard]>=0.54.0",
]
